name: 'Publish'

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck smart.sh

      - name: Compile Python
        run: python3 -m py_compile smart-runner.py smart_runner/*.py

  publish:
    name: Publish
    if: ${{ github.event_name == 'push' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m 1 '^__version__ = ' smart-runner.py | cut -d '"' -f 2)

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version \"$VERSION\" in smart-runner.py" >&2
            exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing tag
        id: existing_tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || STATUS=$?

          # exit code 2 means no matching tag, anything else non-zero is a real error
          case "$STATUS" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$STATUS" ;;
          esac

      - name: Create release
        if: ${{ steps.existing_tag.outputs.exists == 'false' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
